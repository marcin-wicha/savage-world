server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve Compose services at request time so container replacements do not leave stale IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rails_upstream rails_api:80;
    set $storage_upstream object-storage:9000;

    location ^~ /api/ {
        proxy_pass http://$rails_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /graphql {
        proxy_pass http://$rails_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|otf|eot|mp3|mp4|ogg|wav|webm|pdf)$ {
        limit_except GET HEAD { deny all; }
        rewrite ^ /public-assets$uri break;
        proxy_pass http://$storage_upstream;
        proxy_set_header Host object-storage:9000;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
