name: Deploy OCI Stack

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "$DEPLOY_KEY" ]; then
            echo "SSH_PRIVATE_KEY is empty or unavailable to this job"
            exit 1
          fi

          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          ssh-keygen -y -P '' -f "$key_file" > /dev/null || {
            echo "SSH_PRIVATE_KEY is not a valid unencrypted private key"
            exit 1
          }
          echo "SSH_PRIVATE_KEY is present and parses successfully"

      - name: Deploy stack over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          ENV_FILE_CONTENTS: ${{ secrets.ENV_FILE_CONTENTS }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV_FILE_CONTENTS
          script: |
            set -eu
            APP_DIR=/var/www/savage-worlds

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            umask 077
            printf '%s\n' "$ENV_FILE_CONTENTS" > .env

            docker compose up --detach --build --remove-orphans
