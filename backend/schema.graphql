type Edge {
  category: EdgeCategory!
  id: ID!
  minimum_rank: Rank!
  name: String!
  repeatable: Boolean!
  requirements: [Requirement!]!
  requirements_text: String!
  slug: String!
  source_book: String!
  source_page: Int!
}

enum EdgeCategory {
  background
  combat
  leadership
  legendary
  power
  professional
  social
  weird
}

"""
The connection type for Edge.
"""
type EdgeConnection {
  """
  A list of edges.
  """
  edges: [EdgeEdge]

  """
  A list of nodes.
  """
  nodes: [Edge]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type EdgeEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Edge
}

type Hindrance {
  id: ID!
  name: String!
  requirements: [Requirement!]!
  requirements_text: String!
  severity: HindranceSeverity!
  slug: String!
  source_book: String!
  source_page: Int!
}

"""
The connection type for Hindrance.
"""
type HindranceConnection {
  """
  A list of edges.
  """
  edges: [HindranceEdge]

  """
  A list of nodes.
  """
  nodes: [Hindrance]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type HindranceEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Hindrance
}

enum HindranceSeverity {
  major
  minor
  minor_or_major
}

"""
An ISO 8601-encoded datetime
"""
scalar ISO8601DateTime @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

type Origin {
  created_at: ISO8601DateTime!
  id: ID!
  updated_at: ISO8601DateTime!
}

"""
The connection type for Origin.
"""
type OriginConnection {
  """
  A list of edges.
  """
  edges: [OriginEdge]

  """
  A list of nodes.
  """
  nodes: [Origin]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type OriginEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Origin
}

"""
Information about pagination in a connection.
"""
type PageInfo {
  """
  When paginating forwards, the cursor to continue.
  """
  endCursor: String

  """
  When paginating forwards, are there more items?
  """
  hasNextPage: Boolean!

  """
  When paginating backwards, are there more items?
  """
  hasPreviousPage: Boolean!

  """
  When paginating backwards, the cursor to continue.
  """
  startCursor: String
}

type Query {
  edges(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String
    category: EdgeCategory

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
    minimum_rank: Rank
    source_book: String
  ): EdgeConnection!
  hindrances(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
    severity: HindranceSeverity
    source_book: String
  ): HindranceConnection!
  origins(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): OriginConnection!
  viewer: User
}

enum Rank {
  heroic
  legendary
  novice
  seasoned
  veteran
}

type Requirement {
  attribute: String
  clauses: [Requirement!]
  detail: String
  die: Int
  kind: RequirementKind!
  name: String
  skill: String
  slug: String
  text: String
  value: String
}

enum RequirementKind {
  any
  arcane_background
  attribute
  edge
  hindrance
  skill
  special
  wild_card
}

type User {
  email_address: String!
  id: ID!
}
