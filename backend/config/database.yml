default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", ENV.fetch("USER", "postgres")) %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: savage_worlds_development

test:
  <<: *default
  database: savage_worlds_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "savage_worlds_production") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "savage_worlds") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", ENV["SAVAGE_WORLDS_DATABASE_PASSWORD"]) %>
